repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run ruff check .
        language: system
        pass_filenames: false
        types: [python]
      - id: ty
        name: ty
        entry: uv run ty check
        language: system
        pass_filenames: false
        types: [python]
      - id: tests
        name: pytest regression tests
        entry: uv run python -m pytest -q
        language: system
        pass_filenames: false
        files: '^(build_warehouse|city_config|api|app_db|streamlit_app|models/|tests/|views/|seeds/)'
