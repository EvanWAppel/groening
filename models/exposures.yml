version: 2

# Each Streamlit page is a dbt *exposure* — a downstream consumer of the marts.
# Declaring them makes lineage complete (source -> staging -> mart -> page), so
# `dbt docs` and the app's pipeline-lineage view show what each mart feeds.

exposures:
  - name: overview_page
    label: "Page: Overview"
    type: application
    maturity: high
    url: https://groening-production.up.railway.app/
    description: Landing page — one headline metric per topic, read from every mart.
    owner: {name: Evan Appel, email: appelew@gmail.com}
    depends_on:
      - ref('mart_permits_monthly')
      - ref('mart_parks')
      - ref('mart_crime_by_type')
      - ref('mart_short_term_rentals')
      - ref('mart_inspections_monthly')
      - ref('mart_willamette_monthly')
      - ref('mart_weather_annual')
      - ref('mart_air_quality_bad_days')
      - ref('mart_trees_summary')
      - ref('mart_bike_by_year')
      - ref('mart_tourism_annual')
      - ref('mart_marriage_annual')
      - ref('mart_ugb')
      - ref('mart_transit_summary')
      - ref('mart_housing_summary')
      - ref('mart_heritage_summary')

  - name: building_permits_page
    label: "Page: Building Permits"
    type: application
    maturity: high
    url: https://groening-production.up.railway.app/building_permits
    description: Building-permit KPIs, time series, work-class bars, and a 3D hexbin map.
    owner: {name: Evan Appel, email: appelew@gmail.com}
    depends_on:
      - ref('mart_permits_monthly')
      - ref('mart_permits_by_type')
      - ref('mart_permits_map')

  - name: parks_page
    label: "Page: Parks"
    type: application
    maturity: high
    url: https://groening-production.up.railway.app/parks
    description: Park acreage and locations.
    owner: {name: Evan Appel, email: appelew@gmail.com}
    depends_on:
      - ref('mart_parks')

  - name: crime_page
    label: "Page: Reported Crime"
    type: application
    maturity: high
    url: https://groening-production.up.railway.app/crime
    description: Reported crime by type, an hour x weekday heatmap, and a hexbin map.
    owner: {name: Evan Appel, email: appelew@gmail.com}
    depends_on:
      - ref('mart_crime_by_type')
      - ref('mart_crime_by_hour_weekday')
      - ref('mart_crime_map')

  - name: short_term_rentals_page
    label: "Page: Short-Term Rentals"
    type: application
    maturity: high
    url: https://groening-production.up.railway.app/short_term_rentals
    description: Registered short-term-rental permits.
    owner: {name: Evan Appel, email: appelew@gmail.com}
    depends_on:
      - ref('mart_short_term_rentals')

  - name: restaurant_inspections_page
    label: "Page: Restaurant Inspections"
    type: application
    maturity: high
    url: https://groening-production.up.railway.app/restaurant_inspections
    description: Sanitation-score distribution, monthly volume, and recent inspections.
    owner: {name: Evan Appel, email: appelew@gmail.com}
    depends_on:
      - ref('mart_inspections_monthly')
      - ref('mart_inspections_recent')
      - ref('mart_inspections_score_dist')

  - name: willamette_page
    label: "Page: Willamette River"
    type: application
    maturity: high
    url: https://groening-production.up.railway.app/willamette
    description: Willamette River discharge — daily series and monthly averages.
    owner: {name: Evan Appel, email: appelew@gmail.com}
    depends_on:
      - ref('mart_willamette_daily')
      - ref('mart_willamette_monthly')

  - name: weather_page
    label: "Page: Rain & Records"
    type: application
    maturity: high
    url: https://groening-production.up.railway.app/weather
    description: PDX rainfall and temperature — annual, monthly, and wettest days.
    owner: {name: Evan Appel, email: appelew@gmail.com}
    depends_on:
      - ref('mart_weather_annual')
      - ref('mart_weather_monthly')
      - ref('mart_weather_wettest_days')

  - name: air_quality_page
    label: "Page: Air Quality"
    type: application
    maturity: high
    url: https://groening-production.up.railway.app/air_quality
