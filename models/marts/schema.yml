version: 2

# Data-quality tests on the viz-ready marts. These run as part of `dbt build`, so
# a broken grain (duplicate key, unexpected null, out-of-domain category) fails the
# warehouse build before the app can read bad data. Keys asserted `unique` are
# genuine one-row-per-key grains; month/year marts with a second dimension only get
# `not_null`.

models:
  - name: mart_permits_monthly
    description: One row per calendar month of issued building permits.
    columns:
      - name: issue_month
        tests:
          - not_null
          - unique

  - name: mart_weather_annual
    description: One row per year of PDX weather (NOAA GHCN-Daily).
    columns:
      - name: year
        tests:
          - not_null
          - unique

  - name: mart_marriage_annual
    description: One row per year of Multnomah marriage counts.
    columns:
      - name: year
        tests:
          - not_null
          - unique

  - name: mart_tourism_annual
    description: One row per year of PDX international passengers.
    columns:
      - name: year
        tests:
          - not_null
          - unique

  - name: mart_bike_by_year
    description: One row per year bikeway was built.
    columns:
      - name: year_built
        tests:
          - not_null
          - unique

  - name: mart_inspections_monthly
    description: One row per month of restaurant inspections (rolling window).
    columns:
      - name: month
        tests:
          - not_null
          - unique

  - name: mart_crime_monthly
    description: One row per month x crime-against category.
    columns:
      - name: month
        tests:
          - not_null
      - name: crime_against
        tests:
          - not_null

  - name: mart_air_quality_bad_days
    description: One row per year x pollutant of unhealthy-air day counts.
    columns:
      - name: year
        tests:
          - not_null
      - name: pollutant
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["Ozone", "PM2.5"]

  - name: mart_ugb
    description: Single-row Urban Growth Boundary summary.
    columns:
      - name: area_sqmi
        tests:
          - not_null

  - name: mart_trees_summary
    description: Single-row street-tree inventory summary.
    columns:
      - name: total_trees
        tests:
          - not_null

  - name: mart_build_metadata
    description: One row per loaded raw table — build provenance for the "Data as of" banner.
    columns:
      - name: table_name
        tests:
          - not_null
          - unique
      - name: row_count
        tests:
          - not_null
      - name: built_at
        tests:
          - not_null

  - name: mart_transit_routes
    description: One row per TriMet route.
    columns:
      - name: route_id
        tests:
          - not_null
          - unique
      - name: mode
        tests:
          - not_null

  - name: mart_transit_by_mode
    description: One row per transit mode with its route count.
    columns:
      - name: mode
        tests:
          - not_null
          - unique

  - name: mart_transit_stops_map
    description: One row per boardable transit stop (WGS84).
    columns:
      - name: stop_id
        tests:
          - not_null
          - unique

  - name: mart_transit_summary
    description: Single-row transit headline summary.
    columns:
      - name: total_routes
        tests:
          - not_null

  - name: mart_housing_by_year
    description: One row per completion year of regulated affordable housing.
    columns:
      - name: year
        tests:
          - not_null
          - unique

  - name: mart_housing_by_type
    description: One row per building type.
    columns:
      - name: building_type
        tests:
          - not_null
          - unique

  - name: mart_housing_summary
    description: Single-row affordable-housing headline summary.
    columns:
      - name: total_projects
        tests:
          - not_null

  - name: mart_housing_map
    description: One row per regulated affordable-housing project (WGS84).
    columns:
      - name: latitude
        tests:
          - not_null
