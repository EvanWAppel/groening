[project]
name = "groening"
group = "portfolio/geographic"
kind = "app"
status = "active"
repo = "EvanWAppel/groening"
visibility = "public"
on_site = true
verified = true

[deploy]
host = "railway"
services = ["groening"]       # Railway project "groening"; origin groening-production.up.railway.app
domain = "groening.evanappel.me"
origin_urls_closed = false  # groening-production.up.railway.app still serves (HTTP 200, 2026-10-22)

[auth]
scheme = "none"
access_list = ""
target = "cloudflare-access"   # planned first Railway pilot for Access (_system Phase 6)

[data]
db = "duckdb"

[demo]
status = "live"             # whole app is public
url = "https://groening.evanappel.me/"
path = "/"

[keys]
paid = ["anthropic"]        # Ask Tiresias page (via the tiresias library)
isolated = "yes"            # dedicated `groening` Anthropic workspace key, on Railway; Evan confirmed not personal (2026-10-23)
spend_cap = "yes"           # $10/month workspace cap + $5 email alert (Console, 2026-10-23)

[platform]
done = ["PLAT-REG-01"]

[commands]
dev = "uv run streamlit run streamlit_app.py"
test = "uv run pytest"
lint = "uv run ruff check . && uv run ty check"

[meta]
description = "Portland open-data explorer (Streamlit + DuckDB + dbt)"
language = "python"
tags = ["portfolio"]
